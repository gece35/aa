<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Nebula glow blur -->
    <filter id="nebulaBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Bright star glow -->
    <filter id="starGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Small star glow -->
    <filter id="starGlowSm" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background gradient: deep space -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#0f1122"/>
      <stop offset="100%" stop-color="#07080e"/>
    </radialGradient>

    <!-- Main nebula cloud: purple core -->
    <radialGradient id="ng1" cx="46%" cy="54%" r="46%">
      <stop offset="0%"   stop-color="#d8b4fe" stop-opacity="0.95"/>
      <stop offset="28%"  stop-color="#8b5cf6" stop-opacity="0.75"/>
      <stop offset="60%"  stop-color="#4f46e5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal/cyan wing -->
    <radialGradient id="ng2" cx="62%" cy="40%" r="38%">
      <stop offset="0%"   stop-color="#67e8f9" stop-opacity="0.65"/>
      <stop offset="45%"  stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink/rose wing -->
    <radialGradient id="ng3" cx="36%" cy="64%" r="34%">
      <stop offset="0%"   stop-color="#f9a8d4" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#e879f9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent violet wing -->
    <radialGradient id="ng4" cx="55%" cy="60%" r="30%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanner ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#67e8f9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)"/>

  <!-- ── Scattered background stars ── -->
  <circle cx="18" cy="14" r="0.7" fill="white" opacity="0.45"/>
  <circle cx="78" cy="11" r="0.5" fill="white" opacity="0.35"/>
  <circle cx="85" cy="82" r="0.8" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="13" cy="76" r="0.6" fill="white" opacity="0.3"/>
  <circle cx="88" cy="40" r="0.5" fill="#ddd6fe" opacity="0.4"/>
  <circle cx="22" cy="88" r="0.7" fill="white" opacity="0.3"/>
  <circle cx="91" cy="22" r="0.6" fill="white" opacity="0.35"/>

  <!-- ── Nebula cloud layers (blurred) ── -->
  <ellipse cx="48" cy="53" rx="30" ry="27" fill="url(#ng1)" filter="url(#nebulaBlur)"/>
  <ellipse cx="58" cy="43" rx="24" ry="20" fill="url(#ng2)" filter="url(#nebulaBlur)"/>
  <ellipse cx="40" cy="60" rx="20" ry="18" fill="url(#ng3)" filter="url(#nebulaBlur)"/>
  <ellipse cx="54" cy="57" rx="18" ry="15" fill="url(#ng4)" filter="url(#nebulaBlur)"/>

  <!-- ── Secondary nebula stars ── -->
  <circle cx="36" cy="38" r="1.2" fill="white"   opacity="0.75" filter="url(#starGlowSm)"/>
  <circle cx="65" cy="34" r="0.9" fill="#e0f2fe" opacity="0.65" filter="url(#starGlowSm)"/>
  <circle cx="70" cy="65" r="1.1" fill="#c4b5fd" opacity="0.7"  filter="url(#starGlowSm)"/>
  <circle cx="33" cy="64" r="0.8" fill="white"   opacity="0.5"/>
  <circle cx="60" cy="72" r="0.7" fill="#bfdbfe" opacity="0.55"/>

  <!-- ── Scanner outer ring ── -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="url(#ringGrad)" stroke-width="0.8" stroke-opacity="0.55"/>

  <!-- ── Scanner inner dashed ring ── -->
  <circle cx="50" cy="50" r="33" fill="none"
    stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.35"
    stroke-dasharray="4.5 6.5"/>

  <!-- ── Crosshair tick marks at N/E/S/W ── -->
  <line x1="50" y1="7"  x2="50" y2="20" stroke="#c4b5fd" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="50" y2="93" stroke="#c4b5fd" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>
  <line x1="7"  y1="50" x2="20" y2="50" stroke="#c4b5fd" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="93" y2="50" stroke="#c4b5fd" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round"/>

  <!-- ── Bright central star ── -->
  <circle cx="50" cy="50" r="6"   fill="white" opacity="0.85" filter="url(#starGlow)"/>
  <circle cx="50" cy="50" r="2.8" fill="white"/>

  <!-- Star diffraction spikes -->
  <line x1="50" y1="42" x2="50" y2="46" stroke="white" stroke-width="0.9" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="50" y1="54" x2="50" y2="58" stroke="white" stroke-width="0.9" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="42" y1="50" x2="46" y2="50" stroke="white" stroke-width="0.9" stroke-opacity="0.8" stroke-linecap="round"/>
  <line x1="54" y1="50" x2="58" y2="50" stroke="white" stroke-width="0.9" stroke-opacity="0.8" stroke-linecap="round"/>
</svg>
